[project]
name = "horn-experiment"
version = "0.1.0"
description = "Gabriel's Horn Inference Experiment — testing 1/x entropy decay constraints on LLM generation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "scipy>=1.10",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
]

[project.scripts]
horn-experiment = "src.experiment:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
